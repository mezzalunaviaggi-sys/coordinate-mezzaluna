<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mezzaluna Viaggi - Coordinate bancarie</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#eef7fb,#f8fbfd);color:#18324d;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:520px;background:#fff;border-radius:28px;padding:32px 24px;box-shadow:0 12px 40px rgba(18,53,122,.12);text-align:center}
.brand{font-size:28px;font-weight:800;color:#12357a;letter-spacing:.5px}
.brand span{display:block;font-size:15px;color:#2e9dca;margin-top:4px}
h1{font-size:25px;color:#12357a;margin:28px 0 5px}
.sub{color:#718092;font-size:15px;margin-bottom:25px}
.row{text-align:left;padding:13px 0;border-bottom:1px solid #e5edf2}
.intestatario{background:#fff7e6;border:2px solid #e7b84b;border-radius:16px;padding:15px 14px;margin:8px 0 14px}
.intestatario .label{color:#a56b00;font-size:13px}
.intestatario .value{font-size:25px;color:#12357a;letter-spacing:.5px}
.warning{margin-top:7px;font-size:13px;line-height:1.4;color:#7a5700}
.label{font-size:12px;font-weight:700;color:#2e9dca;text-transform:uppercase;margin-bottom:5px}
.value{font-size:17px;font-weight:600}
.ibanbox{margin:23px 0 14px;padding:18px 12px;background:#eaf4f9;border-radius:18px}
.ibanbox input{width:100%;border:0;background:transparent;text-align:center;color:#12357a;ffont-size:15px;;font-weight:700;letter-spacing:.3px;outline:none}
button{width:100%;border:0;border-radius:15px;padding:16px;background:#12357a;color:white;font-size:17px;font-weight:700;cursor:pointer}
button:active{transform:scale(.98)}
#status{min-height:22px;margin-top:10px;font-size:13px;color:#2e9dca;font-weight:600}
.note{margin-top:20px;padding-top:18px;border-top:1px solid #e5edf2;color:#718092;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="brand">MEZZALUNA VIAGGI<span>Esperti in servizi turistici</span></div>
  <h1>Pagamento saldo</h1>
  <div class="sub">Coordinate bancarie</div>
  <div class="row intestatario">
    <div class="label">⚠️ INTESTATARIO DEL BONIFICO</div>
    <div class="value">2D SRLS</div>
    <div class="warning">ATTENZIONE: il bonifico deve essere intestato a <strong>2D SRLS</strong>, NON a Mezzaluna Viaggi.</div>
  </div>
  <div class="row"><div class="label">Banca</div><div class="value">Banca Intesa Sanpaolo</div></div>
  <div class="ibanbox">
    <div class="label">IBAN</div>
    <input id="iban" type="text" value="IT81X0306915726100000072548" readonly onclick="selectIBAN()">
  </div>
  <button onclick="copyIBAN()">📋 COPIA IBAN</button>
  <div id="status"></div>
  <div class="note">Dopo il pagamento, inviaci la ricevuta direttamente su WhatsApp.</div>
</div>
<script>
function selectIBAN(){const input=document.getElementById('iban');input.focus();input.select();input.setSelectionRange(0,input.value.length)}
async function copyIBAN(){
 const input=document.getElementById('iban'),status=document.getElementById('status'),iban=input.value;
 try{
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(iban)}
  else{input.focus();input.select();input.setSelectionRange(0,input.value.length);if(!document.execCommand('copy'))throw new Error('copy blocked')}
  status.textContent='✓ IBAN copiato! Ora puoi incollarlo.'
 }catch(e){input.focus();input.select();input.setSelectionRange(0,input.value.length);status.textContent='IBAN selezionato: premi Copia / Ctrl+C per copiarlo.'}
 setTimeout(()=>status.textContent='',4000)
}
</script>
</body>
</html>
